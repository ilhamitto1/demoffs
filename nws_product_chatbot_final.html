<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NWS Assistant</title>

<style>
:root{
  --bg:#0b111b;
  --panel:#121a28;
  --line:rgba(255,255,255,.08);
  --text:#f7f9fd;
  --muted:#98a4b8;
  --accent:#ff2d2d;
  --success:#22c55e;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:var(--text);
  height:100vh;
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#0e1520;
}

.header{
  padding:16px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-weight:700;
  font-size:18px;
}

.status{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
}

.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);
}

.messages{
  flex:1;
  overflow:auto;
  padding:16px;
}

.message{
  margin-bottom:12px;
  max-width:80%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
}

.bot{
  background:#151f30;
}

.user{
  background:linear-gradient(135deg,#ff2d2d,#ff6262);
  margin-left:auto;
}

.composer{
  border-top:1px solid var(--line);
  padding:10px;
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  resize:none;
  border:none;
  outline:none;
  padding:10px;
  border-radius:14px;
  background:#182233;
  color:white;
  font-size:14px;
}

button{
  background:var(--accent);
  border:none;
  color:white;
  padding:10px 16px;
  border-radius:14px;
  cursor:pointer;
}
button:disabled{opacity:.5}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div>
      <div class="header-title">NWS Assistant</div>
      <div class="status">
        <span class="status-dot"></span>
        Onlayn
      </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Mesajınızı yazın..."></textarea>
    <button id="sendBtn">Göndər</button>
  </div>

</div>

<script>
const N8N_WEBHOOK_URL = "https://ilham33.app.n8n.cloud/webhook/gul-bot";
const REQUEST_TIMEOUT = 15000;

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

function scrollBottom(){
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  messages.appendChild(div);
  scrollBottom();
}

function fallbackReply(text){
  const t=text.toLowerCase();
  if(t.includes("qiymət")) return "Qiymət üçün məhsul adını və ya şəklini göndərin.";
  if(t.includes("çatdırılma")) return "Bakı və rayonlara çatdırılma mövcuddur.";
  if(t.includes("ölçü")) return "Mövcud ölçülər modelə görə dəyişir.";
  return "Salam 😊 Sizə qiymət, ölçü və çatdırılma ilə bağlı kömək edə bilərəm.";
}

async function sendToWebhook(message){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT);

  try{
    const res=await fetch(N8N_WEBHOOK_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body:JSON.stringify({message}),
      signal:controller.signal
    });

    clearTimeout(timeout);

    const text=await res.text();
    if(!text) return null;

    try{
      return JSON.parse(text);
    }catch{
      return {reply:text};
    }

  }catch(err){
    console.error(err);
    return {error:true};
  }
}

async function handleSend(){
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";
  sendBtn.disabled=true;

  const data=await sendToWebhook(text);

  let reply=null;

  if(data){
    reply=data.reply || data.message || data.text || data.output;
  }

  if(data && data.error){
    reply="Serverə qoşulmaq mümkün olmadı. Sonra yenidən yoxlayın.";
  }

  addMessage(reply || fallbackReply(text),"bot");
  sendBtn.disabled=false;
}

input.addEventListener("input",()=>{
  sendBtn.disabled=!input.value.trim();
});

input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener("click",handleSend);

addMessage("Salam 👋 NWS Assistant xidmətinə xoş gəlmisiniz. Sizə necə kömək edə bilərəm?","bot");
</script>

</body>
</html>
