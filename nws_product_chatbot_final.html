
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>NWS Assistant</title>
  <meta name="theme-color" content="#0a0d14" />
  <style>
    :root{
      --bg:#070a10;
      --bg-2:#0c1018;
      --panel:#0e1520;
      --panel-2:#121a28;
      --line:rgba(255,255,255,.08);
      --line-soft:rgba(255,255,255,.05);
      --text:#f7f9fd;
      --muted:#98a4b8;
      --accent:#ff2d2d;
      --accent-2:#ff6262;
      --success:#22c55e;
      --bubble-bot:#101722;
      --bubble-user:#1a2332;
      --shadow:0 20px 60px rgba(0,0,0,.34);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --app-height:100dvh;
      --keyboard-offset:0px;
      --header-height:78px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      position:fixed;
      inset:0;
      background:
        radial-gradient(1000px 420px at 50% -10%, rgba(255,45,45,.15), transparent 36%),
        linear-gradient(180deg,#06080d 0%, #090d14 100%);
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overscroll-behavior:none;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body{ touch-action:pan-x pan-y; }
    button,input,textarea{ font:inherit; }

    .app{
      width:100%;
      height:var(--app-height);
      overflow:hidden;
      padding-top:var(--safe-top);
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .shell{
      width:100%;
      max-width:430px;
      height:100%;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),
        linear-gradient(180deg, #090d14 0%, #0a0f17 100%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
    }

    .header{
      height:var(--header-height);
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 16px 12px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg, rgba(8,10,14,.96), rgba(8,10,14,.84));
      backdrop-filter:blur(18px);
      position:relative;
      z-index:5;
      box-shadow:0 8px 30px rgba(0,0,0,.14);
    }

    .icon-btn{
      width:40px;
      height:40px;
      border:none;
      border-radius:14px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      color:#fff;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      cursor:pointer;
    }

    .brand{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:48px;
      height:48px;
      border-radius:16px;
      overflow:hidden;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      border:1px solid rgba(255,255,255,.06);
      background:
        linear-gradient(145deg, rgba(255,45,45,.24), rgba(255,255,255,.04)),
        #0d1118;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 24px rgba(255,45,45,.12);
      font-weight:800;
      letter-spacing:.08em;
      user-select:none;
    }

    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo.has-image img{ display:block; }
    .logo.has-image .logo-fallback{ display:none; }

    .meta{ min-width:0; }
    .title-row{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }
    .title{
      font-size:17px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      letter-spacing:-.01em;
    }
    .badge{
      font-size:11px;
      font-weight:700;
      border-radius:999px;
      padding:4px 8px;
      white-space:nowrap;
      color:#ffd8d8;
      background:rgba(255,45,45,.14);
      border:1px solid rgba(255,45,45,.22);
    }
    .subtitle{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .status-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--success);
      box-shadow:0 0 0 4px rgba(34,197,94,.12);
      flex:0 0 auto;
    }

    .main{
      height:calc(100% - var(--header-height));
      min-height:0;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .messages{
      flex:1;
      min-height:0;
      overflow:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding:16px 14px 12px;
      scroll-behavior:smooth;
    }
    .messages::-webkit-scrollbar{ width:0; height:0; }

    .quick-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .quick-action{
      border:none;
      cursor:pointer;
      padding:10px 12px;
      border-radius:999px;
      color:#fff;
      background:#121927;
      border:1px solid rgba(255,255,255,.06);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
    }

    .date-sep{
      text-align:center;
      margin:10px 0 14px;
      color:#8994a5;
      font-size:11px;
      font-weight:600;
    }

    .message-row{
      display:flex;
      align-items:flex-end;
      gap:10px;
      margin-bottom:10px;
    }
    .message-row.user{ justify-content:flex-end; }
    .message-row.bot{ justify-content:flex-start; }

    .avatar{
      width:30px;
      height:30px;
      border-radius:10px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      font-size:11px;
      font-weight:800;
      color:#fff;
      background:linear-gradient(135deg, rgba(255,45,45,.22), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.06);
    }

    .stack{
      max-width:min(82%, 320px);
    }

    .bubble{
      width:fit-content;
      max-width:100%;
      padding:12px 13px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 8px 22px rgba(0,0,0,.14);
      font-size:14px;
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .bot .bubble{
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
        var(--bubble-bot);
      border-top-left-radius:8px;
    }

    .user .bubble{
      margin-left:auto;
      background:
        linear-gradient(180deg, rgba(255,45,45,.2), rgba(255,45,45,.08)),
        var(--bubble-user);
      border-top-right-radius:8px;
    }

    .meta-row{
      display:flex;
      align-items:center;
      gap:6px;
      color:#90a0b4;
      font-size:11px;
      margin-top:6px;
      padding:0 4px;
    }
    .user .meta-row{ justify-content:flex-end; }

    .typing{
      display:inline-flex;
      gap:4px;
      align-items:center;
      padding:2px 0;
    }
    .typing span{
      width:6px;
      height:6px;
      border-radius:999px;
      background:#acb5c2;
      display:block;
      animation:blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2){ animation-delay:.15s; }
    .typing span:nth-child(3){ animation-delay:.3s; }

    @keyframes blink{
      0%,80%,100%{ opacity:.25; transform:translateY(0); }
      40%{ opacity:1; transform:translateY(-2px); }
    }

    .composer-wrap{
      flex:0 0 auto;
      padding:10px 12px calc(10px + var(--safe-bottom));
      border-top:1px solid var(--line);
      background:linear-gradient(180deg, rgba(7,10,16,0), rgba(7,10,16,.97) 26%);
      backdrop-filter:blur(18px);
      transform:translateY(calc(var(--keyboard-offset) * -1));
      transition:transform .18s ease;
      position:relative;
      z-index:6;
    }

    .composer-hitbox{
      position:absolute;
      inset:0;
      z-index:0;
    }

    .composer{
      position:relative;
      z-index:1;
      display:flex;
      align-items:flex-end;
      gap:10px;
      border-radius:22px;
      padding:8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)),
        #0b111b;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 14px 32px rgba(0,0,0,.28);
    }

    .tool,
    .send{
      width:42px;
      height:42px;
      border:none;
      border-radius:14px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      color:#fff;
      cursor:pointer;
    }

    .tool{
      background:rgba(255,255,255,.04);
    }

    .send{
      background:linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow:0 10px 26px rgba(255,45,45,.26);
    }
    .send:disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
    }

    .input-wrap{
      flex:1;
      min-width:0;
      display:flex;
      align-items:flex-end;
    }

    .message-input{
      width:100%;
      min-height:24px;
      max-height:120px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:15px;
      line-height:1.45;
      padding:9px 4px 9px 0;
    }
    .message-input::placeholder{ color:#778291; }

    @media (min-width:431px){
      .app{ padding:14px; }
      .shell{
        border-radius:30px;
        border:1px solid rgba(255,255,255,.06);
        box-shadow:0 30px 90px rgba(0,0,0,.42);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <header class="header">
        <button class="icon-btn" aria-label="Geri">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="brand">
          <div class="logo" id="logoBox">
            <img id="logoImg" alt="Logo" />
            <div class="logo-fallback">NWS</div>
          </div>
          <div class="meta">
            <div class="title-row">
              <div class="title">NWS Assistant</div>
              <div class="badge">LIVE</div>
            </div>
            <div class="subtitle">
              <span class="status-dot"></span>
              <span>Qiymət, ölçü, çatdırılma, stok, ünvan</span>
            </div>
          </div>
        </div>

        <button class="icon-btn" id="logoUploadBtn" aria-label="Logo əlavə et">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V8M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 16.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="logoInput" type="file" accept="image/*" hidden />
      </header>

      <main class="main">
        <section class="messages" id="messages">
          <div class="quick-actions">
            <button class="quick-action" data-text="Qiymətlər haqqında məlumat istəyirəm">Qiymətlər</button>
            <button class="quick-action" data-text="Bu model üçün ölçülər hansılardır?">Ölçülər</button>
            <button class="quick-action" data-text="Çatdırılma şərtləri necədir?">Çatdırılma</button>
            <button class="quick-action" data-text="Mağazanın ünvanını göndərin">Ünvan</button>
          </div>

          <div class="date-sep">Bu gün</div>
        </section>

        <div class="composer-wrap">
          <div class="composer-hitbox" id="composerHitbox"></div>

          <div class="composer">
            <button class="tool" id="quickFocusBtn" aria-label="Mesaj yaz">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M7 12H17M12 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>

            <div class="input-wrap">
              <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                placeholder="Mesajınızı yazın..."
                enterkeyhint="send"
              ></textarea>
            </div>

            <button class="send" id="sendBtn" aria-label="Göndər">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const N8N_WEBHOOK_URL = "https://ilham33.app.n8n.cloud/webhook/gul-bot";

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const quickActions = document.querySelectorAll(".quick-action");
    const logoInput = document.getElementById("logoInput");
    const logoUploadBtn = document.getElementById("logoUploadBtn");
    const logoBox = document.getElementById("logoBox");
    const logoImg = document.getElementById("logoImg");
    const composerHitbox = document.getElementById("composerHitbox");
    const quickFocusBtn = document.getElementById("quickFocusBtn");

    const BOT_NAME = "NWS";

    function nowTime(){
      return new Date().toLocaleTimeString("az-AZ", { hour:"2-digit", minute:"2-digit" });
    }

    function escapeHTML(text){
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function updateSendState(){
      sendBtn.disabled = !input.value.trim();
    }

    function autoResize(){
      input.style.height = "24px";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
      updateSendState();
      scrollToBottom(false);
    }

    function scrollToBottom(force=true){
      requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight + (force ? 300 : 80);
      });
    }

    function addMessage(text, type="bot"){
      const row = document.createElement("div");
      row.className = `message-row ${type}`;

      if(type === "bot"){
        row.innerHTML = `
          <div class="avatar">${BOT_NAME}</div>
          <div class="stack">
            <div class="bubble">${escapeHTML(text)}</div>
            <div class="meta-row"><span>${nowTime()}</span></div>
          </div>
        `;
      } else {
        row.innerHTML = `
          <div class="stack">
            <div class="bubble">${escapeHTML(text)}</div>
            <div class="meta-row"><span>${nowTime()}</span></div>
          </div>
        `;
      }

      messages.appendChild(row);
      scrollToBottom(true);
    }

    function addTyping(){
      const row = document.createElement("div");
      row.className = "message-row bot";
      row.id = "typingRow";
      row.innerHTML = `
        <div class="avatar">${BOT_NAME}</div>
        <div class="stack">
          <div class="bubble">
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </div>
      `;
      messages.appendChild(row);
      scrollToBottom(true);
    }

    function removeTyping(){
      const typing = document.getElementById("typingRow");
      if(typing) typing.remove();
    }

    function fallbackReply(text){
      const t = text.toLowerCase();

      if(t.includes("qiymət")){
        return "Qiymət barədə dəqiq məlumat üçün məhsulun şəklini və ya model adını göndərin.";
      }
      if(t.includes("ölçü") || t.includes("razmer")){
        return "Mövcud ölçüləri yoxlamaq üçün modelin şəklini və ya kodunu göndərə bilərsiniz.";
      }
      if(t.includes("çatdırılma")){
        return "Bakı daxili və rayon çatdırılması mövcuddur. Ünvanı yazın, uyğun məlumat təqdim edək.";
      }
      if(t.includes("ünvan")){
        return "Mağazanın ünvanını və yol tarifini sizə göndərə bilərəm.";
      }
      if(t.includes("stok")){
        return "Stok vəziyyəti model və ölçüyə görə dəyişir. Məhsulu qeyd edin, yoxlayaq.";
      }

      return "Salam. Sizə məhsullar, qiymətlər, ölçülər, çatdırılma və stok barədə kömək edə bilərəm.";
    }

    async function sendToWebhook(message){
      if(!N8N_WEBHOOK_URL || N8N_WEBHOOK_URL === "BURAYA_N8N_URL_YAZ"){
        return null;
      }

      try{
        const res = await fetch(N8N_WEBHOOK_URL, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ message })
        });

        if(!res.ok) return null;
        return await res.json().catch(() => null);
      }catch(err){
        return null;
      }
    }

    async function handleSend(){
      const text = input.value.trim();
      if(!text) return;

      addMessage(text, "user");
      input.value = "";
      autoResize();
      addTyping();

      const data = await sendToWebhook(text);
      removeTyping();

      const reply = data && (data.reply || data.message || data.text);
      addMessage(reply || fallbackReply(text), "bot");
    }

    function focusInput(){
      input.focus({ preventScroll:true });
      setTimeout(() => {
        updateViewport();
        scrollToBottom(true);
      }, 50);
      setTimeout(() => {
        updateViewport();
        scrollToBottom(true);
      }, 180);
    }

    function updateViewport(){
      const vv = window.visualViewport;

      if(vv){
        const visibleHeight = vv.height;
        const offsetTop = vv.offsetTop || 0;
        const keyboardOffset = Math.max(0, window.innerHeight - visibleHeight - offsetTop);

        document.documentElement.style.setProperty("--keyboard-offset", keyboardOffset + "px");
        document.documentElement.style.setProperty("--app-height", (visibleHeight + offsetTop) + "px");
      } else {
        document.documentElement.style.setProperty("--keyboard-offset", "0px");
        document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
      }

      scrollToBottom(false);
    }

    input.addEventListener("input", autoResize);
    input.addEventListener("focus", () => {
      setTimeout(updateViewport, 40);
      setTimeout(() => scrollToBottom(true), 90);
      setTimeout(() => scrollToBottom(true), 180);
    });
    input.addEventListener("blur", () => {
      setTimeout(updateViewport, 80);
    });
    input.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener("click", handleSend);
    composerHitbox.addEventListener("click", focusInput);
    quickFocusBtn.addEventListener("click", focusInput);

    quickActions.forEach((btn) => {
      btn.addEventListener("click", () => {
        input.value = btn.dataset.text || btn.textContent.trim();
        autoResize();
        focusInput();
      });
    });

    logoUploadBtn.addEventListener("click", () => logoInput.click());
    logoInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        logoImg.src = reader.result;
        logoBox.classList.add("has-image");
        localStorage.setItem("nws_logo", reader.result);
      };
      reader.readAsDataURL(file);
    });

    const savedLogo = localStorage.getItem("nws_logo");
    if(savedLogo){
      logoImg.src = savedLogo;
      logoBox.classList.add("has-image");
    }

    document.addEventListener("touchmove", (e) => {
      const inMessages = e.target.closest("#messages");
      if(!inMessages){
        e.preventDefault();
      }
    }, { passive:false });

    window.addEventListener("resize", updateViewport, { passive:true });
    window.addEventListener("orientationchange", () => setTimeout(updateViewport, 120), { passive:true });

    if(window.visualViewport){
      visualViewport.addEventListener("resize", updateViewport, { passive:true });
      visualViewport.addEventListener("scroll", updateViewport, { passive:true });
    }

    addMessage("Salam. NWS Assistant xidmətinə xoş gəlmisiniz. Sizə məhsullar, qiymətlər, ölçülər və çatdırılma ilə bağlı kömək edə bilərəm.", "bot");

    autoResize();
    updateViewport();
    scrollToBottom(true);
  </script>
</body>
</html>
